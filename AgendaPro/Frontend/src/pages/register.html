<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendaPro - Criar Conta</title>
  
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="../styles/register.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Cabeçalho -->
      <div class="auth-header">
        <h1 class="auth-brand">AgendaPro</h1>
        <p class="auth-subtitle">Crie sua conta e comece a gerenciar seu espaço.</p>
      </div>

      <!-- Formulário -->
      <form class="auth-form" action="pages/dashboard.html" method="GET">
        
        <div class="form-group">
          <label for="fullName">NOME COMPLETO</label>
          <input type="text" id="fullName" class="form-control" placeholder="Ex: Lucas Silva" required>
        </div>

        <div class="form-group">
          <label for="email">E-MAIL</label>
          <input type="email" id="email" class="form-control" placeholder="seuemail@empresa.com" required>
        </div>

        <div class="form-group">
          <label for="password">SENHA</label>
          <input type="password" id="password" class="form-control" placeholder="Mínimo de 8 caracteres" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">CONFIRMAR SENHA</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repita a senha" required>
        </div>

        <!-- Termos de uso -->
        <label class="terms-checkbox">
          <input type="checkbox" required>
          <span>Concordo com os <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a> do AgendaPro.</span>
        </label>

        <!-- Botão Criar Conta -->
        <button type="submit" class="btn-submit">Criar Minha Conta</button>
      </form>

      <!-- Link para voltar ao Login -->
      <div class="auth-footer">
        Já tem uma conta? <a href="login.html">Fazer Login</a>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
